[project]
name = "hwid"
description = "Extract the `hwid` on Windows, Linux, Mac. Cross-platform using Python, native OS detection."
license = "MIT"
readme = "README.md"
authors = [{ name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "Hasan Sezer Taşan", email = "hasansezertasan@gmail.com" },
]
dynamic = ["version"]
keywords = [
  "hwid",
  "hardware",
  "id",
  "unique",
  "identifier",
  "machine",
  "fingerprint",
  "fingerprinting",
  "licensing",
  "license",
  "identification",
  "command-line",
  "cli",
  "package",
  "metadata",
  "pypi",
  "python",
  "uv",
  "hatch",
  "tox",
  "pytest",
  "ruff",
  "mypy",
  "basedpyright",
  "type-hints",
  "typed",
  "modern-python",
  "ci-cd",
  "github-actions",
  "automation",
  "sphinx",
  "prek",
  "linting",
  "testing",
  "coverage",
  "release-automation",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Python",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",

  "Topic :: Utilities",


]
requires-python = ">=3.10"
# The enabled component's runtime deps live here, not in an optional extra: a
# selected component is chosen at generation time and ``__main__`` imports it
# unconditionally (see the CLI > GUI > TUI > web > MCP > worker precedence
# there), so ``pip install hwid`` must pull them or the binary
# fails at launch. Same for pydantic-settings, which ``core.config`` imports
# unconditionally when enabled.
dependencies = []

[project.urls]
changelog = "https://github.com/hasansezertasan/hwid/blob/main/CHANGELOG.md"
documentation = "https://hasansezertasan.github.io/hwid"
