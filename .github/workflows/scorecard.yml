---
name: "Scorecard supply-chain security"
on:
  # Re-evaluate when branch protection rules change.
  branch_protection_rule:
  schedule:
    - cron: "27 3 * * 1"
  push:
    branches: ["main"]
# Least-privilege default; the analysis job elevates only what it needs.
permissions: read-all
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Job-level permissions replace the workflow's read-all, so re-grant the
      # repository read that actions/checkout needs.
      contents: read
      # Needed to upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Needed to publish the results and mint the OpenSSF Scorecard badge.
      id-token: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish so the badge at scorecard.dev resolves. Public repos only.
          publish_results: true
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4
        with:
          sarif_file: results.sarif
