---
name: Gitignore Drift Check
# Runs `cobo check` to detect when the checked-in .gitignore has drifted from
# the github/gitignore templates recorded in cobo.lock. `cobo update` hits the
# network and is inherently flaky, so this runs on a weekly schedule and on
# demand — never on pull_request, and it is not part of the `check` aggregation
# gate. A failure here is a maintenance signal (regenerate with cobo), not a
# merge blocker — the same non-blocking weekly-check posture. See https://hasansezertasan.github.io/copier-pyproject/context/ci-topology/#network-dependent-checks-run-on-a-weekly-cron-never-in-the-merge-gate.
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 07:00 UTC.
    - cron: "0 7 * * 1"
permissions: {}
jobs:
  gitignore-drift:
    name: Check .gitignore drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        # cobo (mise pipx backend) requires Python >=3.14, but the runner's
        # system Python is older — and without uv on PATH mise falls back from
        # uvx to pipx, which ignores the mise-managed Python. Provision both
        # first so `mise install` resolves cobo against the .python-version
        # interpreter (issue #369).
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install mise tools
        # cobo is pinned in mise.toml (pipx backend, Renovate-tracked) and run
        # via `mise exec`, mirroring how ghalint/all-contributors are invoked.
<<<<<<< before updating
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8  # v5.1.2
=======
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
>>>>>>> after updating
      - name: Refresh cobo sources
        run: mise exec -- cobo update
      - name: Check for gitignore drift
        run: mise exec -- cobo check --strict
