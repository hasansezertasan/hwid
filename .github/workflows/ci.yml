---
name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  hooks:
    name: Run prek hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install mise tools
        # ghalint has no PyPI wrapper or pre-commit hook, so the prek `ghalint`
        # hook runs the mise-managed binary. Install mise's tools (incl. ghalint)
        # and put them on PATH before prek runs.
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d  # v4.2.0
      - name: Run prek hooks
        run: uv run --locked --group prek prek run --all-files --show-diff-on-failure
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    name: Run Tests on ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # The `secrets` context is not available in `if:` conditions, so surface
      # CODECOV_TOKEN as a presence flag — never expose the value job-wide.
      # Codecov upload is opt-in: unset means a visible skip, not a build failure.
      CODECOV_TOKEN_SET: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: System Info
        shell: bash
        run: |
          if [[ ${{ matrix.os }} == "ubuntu-latest" ]]; then
              echo "The system is Linux."
              uname -a || true
              lsb_release -a || true
              gcc --version || true
          elif [[ ${{ matrix.os }} == "macos-latest" ]]; then
              echo "The system is macOS."
              sw_vers || true
              uname -a || true
              gcc --version || true
          elif [[ ${{ matrix.os }} == "windows-latest" ]]; then
              echo "The system is Windows (using a Unix-like environment)."
              systeminfo || true
          else
              echo "Unknown OS: $OS_TYPE"
              exit 1
          fi
      - name: Environment Info
        run: |
          env || true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Run the tests
        run: uv run --locked tox run
      # https://github.com/marketplace/actions/alls-green#why used for branch protection checks
      - name: Coverage
        run: |
          uv run coverage combine
          uv run coverage report --show-missing
          uv run coverage xml
      - name: Upload coverage
        # Upload when the token is set, or on a forked PR (which never receives
        # secrets) so the codecov-action's tokenless fallback still reports
        # coverage for external contributors on a public repo. Same-repo runs
        # with no token fall through to the visible skip below.
        if: ${{ env.CODECOV_TOKEN_SET == 'true' || github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v6.0.2
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Note skipped coverage upload
        if: ${{ env.CODECOV_TOKEN_SET != 'true' && !github.event.pull_request.head.repo.fork && matrix.os == 'ubuntu-latest' }}
        run: echo "::notice::CODECOV_TOKEN secret is not set — skipping the Codecov upload. See .github/CONTRIBUTING.md (Repository setup) to enable coverage reporting."
  check:
    if: always()
    needs: [ci, hooks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
