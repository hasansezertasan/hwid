---
# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: "0.2"
# The generated Code of Conduct and Contributing guide use British spelling
# (behaviour, licence, apologising, …), so enable both US and GB dictionaries.
language: en,en-GB
dictionaries:
  - softwareTerms
  - companies
  - python
  - bash
  - filetypes
  - en_US
allowCompoundWords: true
words:
  # Tooling
  - cobo
  - codespell
  - ghalint
  - megalinter
  - prek
  - unticked
  - zizmor
  - zuban
  - MYENVPREFIX
  - basedpyright
  - Nuitka
  - Oxyry
  - pyarmor
  - pyupgrade
  - sourcery
  - taplo
  - xdist
  - zizmor
  - zuban
  # Project / package identifiers, so a project never trips on its own name/handle.
  # Quoted so a name that is a YAML boolean/null token (e.g. a repo literally
  # named "off" or "null") still renders as a string, which cspell requires.
  - "hwid"
  - "hasansezertasan"
  # Author / handle
  - Hasan
  - Sezer
  - Taşan
  # Sphinx / docs vocabulary
  - nojekyll
  - paramlinks
  - pytabs
  - Shibuya
  - toctree
  # Misc technical terms
  - bysource
  - capsys
  - dbeaver
  - envname
  - pgadmin
  - pkgs
  - reimplementations
  - sunos
