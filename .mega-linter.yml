---
PARALLEL: true
DEFAULT_BRANCH: main
SHOW_ELAPSED_TIME: true
CLEAR_REPORT_FOLDER: true
OUTPUT_DETAIL: detailed
REPORT_OUTPUT_FOLDER: megalinter-reports
# CHANGELOG.md is generated and owned by release-please (double blank lines
# between sections, commit-hash links, etc.); exclude it from all linters so
# release PRs don't fail markdownlint/cspell on machine-generated content.
FILTER_REGEX_EXCLUDE: (^|/)CHANGELOG\.md$
# MegaLinter is an additional CI quality layer. tox/prek remain the canonical
# local and blocking style runners, so MegaLinter avoids auto-fixes and Python
# type/lint duplication.
APPLY_FIXES: none
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false
FILEIO_REPORTER: false
JSON_REPORTER: true
JSON_REPORTER_OUTPUT_DETAIL: simple
MARKDOWN_SUMMARY_REPORTER: true
REPORTERS_MARKDOWN_TYPE: simple
SARIF_REPORTER: true
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - BASH_SHELLCHECK
  - EDITORCONFIG_EDITORCONFIG_CHECKER
  - MARKDOWN_MARKDOWNLINT
  - SPELL_CSPELL
  - YAML_YAMLLINT
EXCLUDED_DIRECTORIES:
  - .git
  - .mypy_cache
  - .nox
  - .tox
  - .venv
  - build
  - dist
  - docs/_build
  - htmlcov
  - megalinter-reports
  - node_modules
ACTION_ACTIONLINT_CONFIG_FILE: .github/actionlint.yaml
BASH_SHELLCHECK_CONFIG_FILE: .github/linters/.shellcheckrc
MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .github/linters/.markdownlint.yml
SPELL_CSPELL_CONFIG_FILE: .github/linters/.cspell.yml
SPELL_CSPELL_FILE_EXTENSIONS:
  - .md
YAML_YAMLLINT_CONFIG_FILE: .github/yamllint.yaml
